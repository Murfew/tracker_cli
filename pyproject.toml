[project]
name = "tracker-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Murfew", email = "matthew.hurley953@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["typer>=0.27.3"]

[project.scripts]
tracker = "tracker_cli.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.0", "pydantic>=2.14.1", "pytest>=9.1.1", "ruff>=0.17.2"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PIE",
    "PTH",
    "PERF",
    "ARG",
    "DTZ",
    "S",
    "T20",
    "ERA",
    "TRY",
    "ASYNC",
    "FAST",
    "PL",
    "RUF",
]
ignore = ["E501", "TRY003", "PLR0913", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["tracker_cli"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "explicit-override",
]
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
