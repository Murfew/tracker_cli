[project]
name = "tracker-cli"
version = "0.1.0"
description = "Log workout sets from the terminal and see your weekly volume and best lifts."
readme = "README.md"
authors = [{ name = "Murfew", email = "matthew.hurley953@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["typer>=0.27.3"]

[project.scripts]
tracker = "tracker_cli.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.0", "pydantic>=2.14.1", "pytest>=9.1.1", "ruff>=0.17.2"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",     # pycodestyle: PEP 8 basics every reviewer expects
    "F",     # pyflakes: real mistakes like unused imports and undefined names
    "I",     # isort: consistent import order, no merge-conflict churn
    "N",     # pep8-naming: snake_case/PascalCase so names read as Python
    "UP",    # pyupgrade: modern syntax (list[int], X | None) for my Python version
    "B",     # bugbear: likely bugs like mutable default arguments
    "C4",    # comprehensions: cleaner, faster list/dict/set building
    "SIM",   # simplify: more Pythonic idioms in place of clunky if/else
    "RET",   # return: no else after return, no pointless temp variables
    "PIE",   # misc: removes dead or unnecessary code
    "PTH",   # pathlib: Path over os.path, the modern standard
    "PERF",  # performance: catches slow loop patterns
    "ARG",   # unused arguments: often a leftover or a bug
    "DTZ",   # datetimez: no naive datetimes; set dates must compare correctly
    "S",     # bandit: security, e.g. SQL built with f-strings (use ? placeholders)
    "T20",   # print: user output goes through Typer, debugging through logging
    "ERA",   # commented-out code: git keeps history, so delete it
    "TRY",   # exceptions: narrow try blocks, proper raising and logging
    "ASYNC", # async pitfalls: blocking calls in async code (for later services)
    "FAST",  # FastAPI rules: unused here, ready for the coach
    "PL",    # pylint subset: code smells like magic numbers and too many branches
    "RUF",   # Ruff's own rules, including stale noqa comments
]
ignore = [
    "E501",    # line length: ruff format already wraps lines
    "TRY003",  # long exception messages: custom classes for each is overkill
    "PLR0913", # too many arguments: noisy with Typer options and DI
    "COM812",
    "ISC001",  # conflict with ruff format, per Ruff's own docs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest is built on assert
    "PLR2004", # magic numbers are normal in expected values
    "ARG",     # fixtures look like unused arguments
]

[tool.ruff.lint.isort]
known-first-party = ["tracker"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "explicit-override",
]
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
